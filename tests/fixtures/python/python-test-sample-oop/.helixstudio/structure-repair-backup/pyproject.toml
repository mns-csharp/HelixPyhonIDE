[project]
name = "python-test-sample"
version = "0.1.0"
requires-python = ">=3.12"
description = "Hand-crafted multi-package Python workspace used for manual QA of HelixStudio's IDE features."

[tool.uv.workspace]
members = [
    "src/lib_core",
    "src/lib_utils",
    "src/app_cli",
    "src/app_server",
    "src/app_gui",
    "my_unit_test_package",
]

[tool.helixstudio]
interface-style = "protocol"
