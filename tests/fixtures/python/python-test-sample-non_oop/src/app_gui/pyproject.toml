[project]
name = "app_gui"
version = "0.1.0"
requires-python = ">=3.12"
description = "Tkinter desktop demo that drives the same lib_core / lib_utils API as app_cli, from a GUI angle."
dependencies = ["lib_core", "lib_utils"]

[project.scripts]
app-gui = "app_gui.main:main"

[tool.helixstudio]
interface-style = "protocol"
kind = "gui"
gui-framework = "tkinter"
